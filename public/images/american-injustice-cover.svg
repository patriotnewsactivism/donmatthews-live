<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 2560" role="img" aria-labelledby="title description">
  <title id="title">American Injustice by Don Matthews</title>
  <desc id="description">A black and gold legal-thriller book cover with courthouse columns, documentary markings, and the subtitle A Memoir of Constitutional Warfare.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050505"/>
      <stop offset="0.55" stop-color="#10100f"/>
      <stop offset="1" stop-color="#030303"/>
    </linearGradient>
    <radialGradient id="signal" cx="76%" cy="29%" r="64%">
      <stop offset="0" stop-color="#d6b858" stop-opacity="0.2"/>
      <stop offset="0.45" stop-color="#8d7027" stop-opacity="0.055"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9b7728"/>
      <stop offset="0.48" stop-color="#e2c76f"/>
      <stop offset="1" stop-color="#a98430"/>
    </linearGradient>
    <pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M80 0H0V80" fill="none" stroke="#f4e7bd" stroke-opacity="0.035" stroke-width="2"/>
    </pattern>
    <filter id="paper" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.75" numOctaves="3" seed="17" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0" result="mono"/>
      <feComponentTransfer in="mono" result="softNoise">
        <feFuncA type="table" tableValues="0 0.12"/>
      </feComponentTransfer>
      <feBlend in="SourceGraphic" in2="softNoise" mode="screen"/>
    </filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#000" flood-opacity="0.72"/>
    </filter>
  </defs>

  <rect width="1600" height="2560" fill="url(#background)"/>
  <rect width="1600" height="2560" fill="url(#signal)"/>
  <rect width="1600" height="2560" fill="url(#grid)"/>
  <rect x="52" y="52" width="1496" height="2456" fill="none" stroke="#d0ae50" stroke-opacity="0.28" stroke-width="3"/>
  <rect x="76" y="76" width="1448" height="2408" fill="none" stroke="#fff" stroke-opacity="0.045" stroke-width="2"/>

  <g opacity="0.12" fill="#ead99b">
    <path d="M878 1060 1232 854l354 206v40H878z"/>
    <rect x="914" y="1120" width="54" height="650"/>
    <rect x="1050" y="1120" width="54" height="650"/>
    <rect x="1186" y="1120" width="54" height="650"/>
    <rect x="1322" y="1120" width="54" height="650"/>
    <rect x="1458" y="1120" width="54" height="650"/>
    <rect x="884" y="1770" width="676" height="52"/>
    <rect x="850" y="1832" width="740" height="34"/>
  </g>

  <g opacity="0.15" fill="none" stroke="#d8bd64" stroke-width="4">
    <circle cx="1220" cy="1320" r="340"/>
    <circle cx="1220" cy="1320" r="292" stroke-dasharray="6 16"/>
    <circle cx="1220" cy="1320" r="234"/>
  </g>

  <g fill="#d5b75d" font-family="Arial, Helvetica, sans-serif" font-weight="700" letter-spacing="12">
    <text x="120" y="190" font-size="34">THE TRUE STORY OF FIGHTING BACK</text>
    <text x="121" y="248" font-size="21" fill-opacity="0.58" letter-spacing="7">SOURCE-FIRST NONFICTION  ·  THE PUBLIC RECORD</text>
  </g>
  <rect x="120" y="304" width="320" height="5" fill="url(#gold)"/>
  <rect x="452" y="304" width="990" height="1" fill="#fff" opacity="0.12"/>

  <g filter="url(#shadow)">
    <text x="108" y="662" fill="#f2eee2" font-family="Georgia, 'Times New Roman', serif" font-size="238" font-weight="700" letter-spacing="-9">AMERICAN</text>
    <text x="108" y="920" fill="url(#gold)" font-family="Georgia, 'Times New Roman', serif" font-size="220" font-weight="700" letter-spacing="-8">INJUSTICE</text>
  </g>

  <rect x="122" y="1042" width="10" height="585" fill="#9e2b24"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="178" y="1110" fill="#d8bc63" font-size="31" font-weight="700" letter-spacing="8">A MEMOIR OF</text>
    <text x="176" y="1210" fill="#f4f0e6" font-size="68" font-weight="700" letter-spacing="1">CONSTITUTIONAL</text>
    <text x="176" y="1290" fill="#f4f0e6" font-size="68" font-weight="700" letter-spacing="1">WARFARE</text>

    <text x="178" y="1436" fill="#fff" fill-opacity="0.56" font-size="27" letter-spacing="3">LIVED EXPERIENCE</text>
    <text x="178" y="1490" fill="#fff" fill-opacity="0.56" font-size="27" letter-spacing="3">COURT RECORDS</text>
    <text x="178" y="1544" fill="#fff" fill-opacity="0.56" font-size="27" letter-spacing="3">PUBLIC DOCUMENTS</text>
    <text x="178" y="1598" fill="#fff" fill-opacity="0.56" font-size="27" letter-spacing="3">THE COLLISION WITH POWER</text>
  </g>

  <g opacity="0.18" fill="#fff">
    <rect x="118" y="1770" width="555" height="28"/>
    <rect x="118" y="1820" width="404" height="28"/>
    <rect x="118" y="1870" width="628" height="28"/>
    <rect x="118" y="1920" width="482" height="28"/>
  </g>
  <g fill="#9e2b24" opacity="0.92">
    <rect x="330" y="1764" width="292" height="40"/>
    <rect x="118" y="1864" width="372" height="40"/>
    <rect x="460" y="1914" width="238" height="40"/>
  </g>
  <text x="118" y="2028" fill="#d8bc63" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" letter-spacing="6">EXHIBIT  /  TESTIMONY  /  CONFLICT  /  CORRECTION</text>

  <g font-family="Arial, Helvetica, sans-serif">
    <text x="118" y="2268" fill="#f3efe4" font-size="88" font-weight="800" letter-spacing="8">DON MATTHEWS</text>
    <text x="122" y="2342" fill="#d8bc63" font-size="25" font-weight="700" letter-spacing="9">JOURNALIST  ·  AUTHOR</text>
  </g>
  <rect x="118" y="2404" width="1324" height="2" fill="#d2b255" opacity="0.44"/>
  <g fill="#fff" opacity="0.24">
    <rect x="118" y="2442" width="4" height="22"/>
    <rect x="132" y="2442" width="10" height="22"/>
    <rect x="154" y="2442" width="3" height="22"/>
    <rect x="168" y="2442" width="16" height="22"/>
    <rect x="198" y="2442" width="5" height="22"/>
    <rect x="214" y="2442" width="9" height="22"/>
    <rect x="238" y="2442" width="3" height="22"/>
    <rect x="252" y="2442" width="19" height="22"/>
  </g>
  <text x="1442" y="2461" text-anchor="end" fill="#fff" fill-opacity="0.28" font-family="Arial, Helvetica, sans-serif" font-size="19" letter-spacing="5">DONMATTHEWS.LIVE</text>
  <rect width="1600" height="2560" fill="transparent" filter="url(#paper)" opacity="0.48"/>
</svg>
