name: Deploy Don Voice Agent

on:
  push:
    branches: [main]
    paths:
      - "voice-agent/**"
      - ".github/workflows/deploy-voice-agent.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: don-voice-agent-production
  cancel-in-progress: false

env:
  GCP_PROJECT_ID: buildmybot-507112
  GCP_CLOUD_RUN_REGION: us-central1
  GCP_CLOUD_RUN_SERVICE: don-voice-agent
  GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}

jobs:
  deploy:
    name: Update verified voice service
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Validate deployment identity
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${GCP_SA_KEY:-}" ]]; then
            echo "Missing required deployment setting: GCP_SA_KEY" >&2
            exit 2
          fi

      - name: Authenticate with Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ env.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Verify existing target and derive immutable image
        id: target
        shell: bash
        run: |
          set -euo pipefail
          service_json="$(gcloud run services describe "$GCP_CLOUD_RUN_SERVICE" \
            --project "$GCP_PROJECT_ID" \
            --region "$GCP_CLOUD_RUN_REGION" \
            --platform managed \
            --format=json)"

          current_image="$(jq -r '.spec.template.spec.containers[0].image // empty' <<<"$service_json")"
          expected_repo="us-central1-docker.pkg.dev/buildmybot-507112/cloud-run-source-deploy/don-voice-agent"
          if [[ "$current_image" != "$expected_repo:"* && "$current_image" != "$expected_repo@"* ]]; then
            echo "Refusing to deploy: existing service image is outside the verified voice-agent repository." >&2
            exit 3
          fi

          image="$expected_repo:$GITHUB_SHA"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "Verified existing target: $GCP_PROJECT_ID / $GCP_CLOUD_RUN_REGION / $GCP_CLOUD_RUN_SERVICE"

      - name: Build immutable voice-agent image
        shell: bash
        run: |
          set -euo pipefail
          gcloud builds submit voice-agent \
            --project "$GCP_PROJECT_ID" \
            --tag "${{ steps.target.outputs.image }}" \
            --timeout=1200

      - name: Update only the existing voice service image
        shell: bash
        run: |
          set -euo pipefail
          gcloud run services update "$GCP_CLOUD_RUN_SERVICE" \
            --project "$GCP_PROJECT_ID" \
            --region "$GCP_CLOUD_RUN_REGION" \
            --platform managed \
            --image "${{ steps.target.outputs.image }}" \
            --quiet

      - name: Verify Ready revision and health
        shell: bash
        run: |
          set -euo pipefail
          expected_image="${{ steps.target.outputs.image }}"
          for attempt in {1..36}; do
            service_json="$(gcloud run services describe "$GCP_CLOUD_RUN_SERVICE" \
              --project "$GCP_PROJECT_ID" \
              --region "$GCP_CLOUD_RUN_REGION" \
              --platform managed \
              --format=json)"
            created="$(jq -r '.status.latestCreatedRevisionName // empty' <<<"$service_json")"
            ready="$(jq -r '.status.latestReadyRevisionName // empty' <<<"$service_json")"
            live_image="$(jq -r '.spec.template.spec.containers[0].image // empty' <<<"$service_json")"
            if [[ -n "$created" && "$created" == "$ready" && "$live_image" == "$expected_image" ]]; then
              break
            fi
            sleep 5
          done

          if [[ -z "${created:-}" || "$created" != "$ready" || "$live_image" != "$expected_image" ]]; then
            echo "Voice-agent revision did not become Ready with the expected image." >&2
            exit 4
          fi

          service_url="$(jq -r '.status.url // empty' <<<"$service_json")"
          body="$(curl -fsS --retry 6 --retry-delay 3 --max-time 20 "${service_url%/}/health")"
          jq -e '.ok == true and .service == "don-voice-agent" and .agent == true and .xai == "configured"' <<<"$body" >/dev/null
          echo "Voice-agent release verified at $service_url revision $ready"
