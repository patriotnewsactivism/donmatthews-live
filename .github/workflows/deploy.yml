name: Deploy to Cloud Run

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: donmatthews-production
  cancel-in-progress: false

env:
  GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GCP_CLOUD_RUN_REGION: ${{ secrets.GCP_CLOUD_RUN_REGION }}
  GCP_CLOUD_RUN_SERVICE: ${{ secrets.GCP_CLOUD_RUN_SERVICE }}
  GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}

jobs:
  quality:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build

  deploy:
    name: Deploy existing Cloud Run service
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate deployment configuration
        shell: bash
        run: |
          set -euo pipefail
          for name in GCP_PROJECT_ID GCP_CLOUD_RUN_REGION GCP_CLOUD_RUN_SERVICE GCP_SA_KEY; do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing required deployment setting: $name" >&2
              exit 2
            fi
          done

      - name: Authenticate with Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ env.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Verify exact existing target and derive immutable image
        id: target
        shell: bash
        run: |
          set -euo pipefail
          service_json="$(gcloud run services describe "$GCP_CLOUD_RUN_SERVICE" \
            --project "$GCP_PROJECT_ID" \
            --region "$GCP_CLOUD_RUN_REGION" \
            --platform managed \
            --format=json)"

          current_image="$(jq -r '.spec.template.spec.containers[0].image // empty' <<<"$service_json")"
          if [[ -z "$current_image" ]]; then
            echo "Existing Cloud Run service has no readable image." >&2
            exit 3
          fi

          image_repo="${current_image%@*}"
          if [[ "$image_repo" == "$current_image" ]]; then
            image_repo="${current_image%:*}"
          fi
          if [[ -z "$image_repo" || "$image_repo" != *"/"* ]]; then
            echo "Unable to derive image repository from existing service." >&2
            exit 3
          fi

          image="${image_repo}:${GITHUB_SHA}"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "Verified existing target: $GCP_PROJECT_ID / $GCP_CLOUD_RUN_REGION / $GCP_CLOUD_RUN_SERVICE"
          echo "Release image: $image"

      - name: Build immutable image with Cloud Build
        shell: bash
        run: |
          set -euo pipefail
          gcloud builds submit . \
            --project "$GCP_PROJECT_ID" \
            --tag "${{ steps.target.outputs.image }}" \
            --timeout=1200

      - name: Update only the existing Cloud Run service
        shell: bash
        run: |
          set -euo pipefail
          gcloud run services update "$GCP_CLOUD_RUN_SERVICE" \
            --project "$GCP_PROJECT_ID" \
            --region "$GCP_CLOUD_RUN_REGION" \
            --platform managed \
            --image "${{ steps.target.outputs.image }}" \
            --update-env-vars "DONMATTHEWS_BUILD_SHA=$GITHUB_SHA" \
            --quiet

      - name: Verify Ready revision and live build SHA
        shell: bash
        run: |
          set -euo pipefail
          ready=""
          created=""
          for attempt in {1..36}; do
            service_json="$(gcloud run services describe "$GCP_CLOUD_RUN_SERVICE" \
              --project "$GCP_PROJECT_ID" \
              --region "$GCP_CLOUD_RUN_REGION" \
              --platform managed \
              --format=json)"
            created="$(jq -r '.status.latestCreatedRevisionName // empty' <<<"$service_json")"
            ready="$(jq -r '.status.latestReadyRevisionName // empty' <<<"$service_json")"
            if [[ -n "$created" && "$created" == "$ready" ]]; then
              break
            fi
            sleep 5
          done
          if [[ -z "$created" || "$created" != "$ready" ]]; then
            echo "Cloud Run revision did not become Ready. created=$created ready=$ready" >&2
            exit 4
          fi

          service_url="$(gcloud run services describe "$GCP_CLOUD_RUN_SERVICE" \
            --project "$GCP_PROJECT_ID" \
            --region "$GCP_CLOUD_RUN_REGION" \
            --platform managed \
            --format='value(status.url)')"
          body="$(curl -fsS --retry 6 --retry-delay 3 --max-time 20 "${service_url%/}/api/health")"
          live_sha="$(jq -r '.build.sha // empty' <<<"$body")"
          if [[ "$live_sha" != "$GITHUB_SHA" ]]; then
            echo "Live SHA mismatch. expected=$GITHUB_SHA actual=$live_sha" >&2
            exit 5
          fi
          echo "Cloud Run release verified at $service_url with SHA $live_sha"
