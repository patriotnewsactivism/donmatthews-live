name: Diagnose Cloud Run target

on:
  push:
    branches: [ops/harden-cloud-run-production]
  workflow_dispatch:

permissions:
  contents: read

env:
  GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GCP_CLOUD_RUN_REGION: ${{ secrets.GCP_CLOUD_RUN_REGION }}
  GCP_CLOUD_RUN_SERVICE: ${{ secrets.GCP_CLOUD_RUN_SERVICE }}
  GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Report configuration presence only
        shell: bash
        run: |
          set -euo pipefail
          present() { [[ -n "${!1:-}" ]] && echo yes || echo no; }
          echo "GCP_PROJECT_ID=$(present GCP_PROJECT_ID)"
          echo "GCP_CLOUD_RUN_REGION=$(present GCP_CLOUD_RUN_REGION)"
          echo "GCP_CLOUD_RUN_SERVICE=$(present GCP_CLOUD_RUN_SERVICE)"
          echo "GCP_SA_KEY=$(present GCP_SA_KEY)"
      - name: Authenticate
        if: env.GCP_SA_KEY != ''
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ env.GCP_SA_KEY }}
      - name: Set up Cloud SDK
        if: env.GCP_SA_KEY != ''
        uses: google-github-actions/setup-gcloud@v3
      - name: Describe exact configured service read-only
        if: env.GCP_SA_KEY != '' && env.GCP_PROJECT_ID != '' && env.GCP_CLOUD_RUN_REGION != '' && env.GCP_CLOUD_RUN_SERVICE != ''
        shell: bash
        run: |
          set -euo pipefail
          gcloud run services describe "$GCP_CLOUD_RUN_SERVICE" \
            --project "$GCP_PROJECT_ID" \
            --region "$GCP_CLOUD_RUN_REGION" \
            --platform managed \
            --format='yaml(metadata.name,status.url,status.latestCreatedRevisionName,status.latestReadyRevisionName,spec.template.spec.containers[0].image)'
          echo 'Domain mappings in configured region:'
          gcloud run domain-mappings list \
            --project "$GCP_PROJECT_ID" \
            --region "$GCP_CLOUD_RUN_REGION" \
            --platform managed \
            --format='table(metadata.name,spec.routeName,status.conditions[0].status)' || true
